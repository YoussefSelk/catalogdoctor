name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install uv==0.11.26
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest --junitxml=test-results.xml -W error
      - name: Verify deterministic example generation
        run: |
          uv run --no-sync python examples/generate_data.py
          git diff --exit-code -- examples/catalog.csv examples/ground_truth.json examples/rules.yml
      - name: Build and install wheel independently
        run: |
          uv run --no-sync python -m build
          python -m venv /tmp/catalogdoctor-wheel
          /tmp/catalogdoctor-wheel/bin/pip install -r requirements.txt dist/*.whl
          /tmp/catalogdoctor-wheel/bin/catalogdoctor scan --output /tmp/wheel-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python }}
          path: test-results.xml
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t catalogdoctor:ci .
      - name: Start and verify dashboard
        run: |
          docker run -d --name doctor -p 127.0.0.1:8501:8501 catalogdoctor:ci
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs doctor
          exit 1
